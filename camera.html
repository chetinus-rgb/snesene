<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Камера</title>
<style>
  body { margin: 0; background: #000; }
  video { width: 100%; height: 100vh; object-fit: cover; }
  button { position: fixed; bottom: 20px; left: 20px; padding: 12px 20px;
           font-size: 16px; border-radius: 10px; border: none; }
</style>
</head>
<body>
  <video id="cam" autoplay playsinline muted></video>
  <button onclick="startCam()">Включить камеру</button>

<script>
  async function startCam() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" }, // "user" — фронтальная камера
        audio: false
      });
      document.getElementById("cam").srcObject = stream;
    } catch (e) {
      alert("Доступ к камере не получен: " + e.name);
    }
  }
</script>
</body>
</html>
